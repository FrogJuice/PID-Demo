# Publishes the Noodle web app (noodle/) to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy Noodle to Pages
on:
  push:
    branches: [master]
    paths: ['noodle/**', '.github/workflows/noodle-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test noodle/test/*.test.js
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: noodle }
      - id: deployment
        uses: actions/deploy-pages@v4
